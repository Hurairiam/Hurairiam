<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Samurai-style banner: a red sun over dark mountains with a katana slash">
<style>
  .petal{animation:fall linear infinite;opacity:0}
  @keyframes fall{0%{transform:translate(0,-10px) rotate(0deg);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translate(70px,250px) rotate(420deg);opacity:0}}
  .slash{stroke-dasharray:1000;stroke-dashoffset:0;animation:draw 1.3s .4s cubic-bezier(.3,.7,.2,1) backwards}
  @keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
  .glint{opacity:.9;animation:glint 1.3s .4s ease-out backwards}
  @keyframes glint{0%{opacity:0}60%{opacity:0}85%{opacity:1}100%{opacity:.9}}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09090d"/><stop offset=".65" stop-color="#150c10"/><stop offset="1" stop-color="#25100f"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d0202c" stop-opacity=".55"/><stop offset="1" stop-color="#d0202c" stop-opacity="0"/></radialGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e23a30"/><stop offset="1" stop-color="#8f1220"/></linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".25" stop-color="#f6e7b0"/><stop offset=".6" stop-color="#ffffff"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4af37" stop-opacity="0"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1000" height="240" fill="url(#sky)"/>
<circle cx="735" cy="118" r="150" fill="url(#glow)"/>
<circle cx="735" cy="118" r="80" fill="url(#sun)"/>
<!-- far mountains -->
<path d="M0 190 L90 150 L170 178 L270 118 L370 176 L450 140 L560 188 L660 142 L760 184 L860 130 L1000 182 L1000 240 L0 240 Z" fill="#17131a" opacity=".95"/>
<!-- near mountains -->
<path d="M0 214 L120 182 L230 208 L350 170 L470 212 L590 190 L700 218 L820 186 L920 208 L1000 192 L1000 240 L0 240 Z" fill="#0b0a0e"/>
<!-- torii gate -->
<g fill="#7d1220" transform="translate(150,128)">
  <path d="M-34 6 Q0 -2 34 6 L38 -2 Q0 -12 -38 -2 Z"/>
  <rect x="-28" y="10" width="56" height="5"/>
  <rect x="-23" y="8" width="7" height="62"/>
  <rect x="16" y="8" width="7" height="62"/>
</g>
<!-- sun reflection line -->
<rect x="0" y="218" width="1000" height="1.5" fill="url(#edge)" opacity=".5"/>
<!-- katana slash -->
<path class="slash" pathLength="1000" d="M70 196 L930 46" stroke="url(#blade)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
<path class="slash" pathLength="1000" d="M70 196 L930 46" stroke="#f6e7b0" stroke-width="7" stroke-linecap="round" fill="none" opacity=".12"/>
<g class="glint"><path d="M930 46 l-9 0 M930 46 l9 0 M930 46 l0 -9 M930 46 l0 9" stroke="#fff6d6" stroke-width="1.5"/></g>
<g transform="translate(90,0)"><g class="petal" style="animation-duration:7.5s;animation-delay:0s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(210,0)"><g class="petal" style="animation-duration:9s;animation-delay:2.2s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(330,0)"><g class="petal" style="animation-duration:8s;animation-delay:4.1s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(470,0)"><g class="petal" style="animation-duration:10s;animation-delay:1.3s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(600,0)"><g class="petal" style="animation-duration:7s;animation-delay:5.2s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(760,0)"><g class="petal" style="animation-duration:9s;animation-delay:3.1s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(880,0)"><g class="petal" style="animation-duration:8s;animation-delay:0.7s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(940,0)"><g class="petal" style="animation-duration:7s;animation-delay:4.6s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(150,0)"><g class="petal" style="animation-duration:6s;animation-delay:6.0s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>
<g transform="translate(540,0)"><g class="petal" style="animation-duration:6.5s;animation-delay:2.9s"><ellipse rx="5" ry="2.6" fill="#f0b6c6"/></g></g>

</svg>